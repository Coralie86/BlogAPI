<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="210"/>
    </clipPath>
  </defs>

  <!-- Green circular background -->
  <circle cx="256" cy="256" r="210" fill="#5bc956"/>

  <!-- Long diagonal shadow -->
  <path
    d="M337 111
       L398 170
       L423 194
       L403 221
       L420 238
       L401 258
       L423 280
       L405 299
       L425 320
       L406 340
       L427 361
       L405 382
       L423 400
       L394 429
       L365 446
       L338 466
       L466 466
       A210 210 0 0 0 466 256
       L466 191
       L420 153
       L383 119 Z"
    fill="#479c43"
    clip-path="url(#circleClip)"
  />

  <!-- Notebook -->
  <rect x="178" y="126" width="184" height="276" rx="23"
        fill="none" stroke="#ffffff" stroke-width="14"/>

  <!-- BLOG text -->
  <text x="270" y="219"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        fill="#ffffff">BLOG</text>

  <!-- Pencil: shadow/back -->
  <g transform="rotate(-39 326 290)">
    <!-- pencil body -->
    <rect x="282" y="253" width="166" height="42" rx="7"
          fill="#ffffff"/>
    <rect x="282" y="253" width="166" height="8" fill="#e8e8e8"/>
    <rect x="282" y="287" width="166" height="8" fill="#e8e8e8"/>

    <!-- pencil tip -->
    <path d="M282 253 L282 295 L235 274 Z" fill="#ffffff"/>
    <path d="M235 274 L282 266 L282 282 Z" fill="#ffffff"/>
    <path d="M235 274 L249 270 L243 282 Z" fill="#ffffff"/>

    <!-- eraser -->
    <path d="M448 253
             C464 253 475 262 475 274
             C475 286 464 295 448 295
             Z"
          fill="#ffffff"/>

    <!-- subtle pencil separator lines -->
    <line x1="434" y1="253" x2="434" y2="295"
          stroke="#dcdcdc" stroke-width="4"/>
  </g>
</svg>